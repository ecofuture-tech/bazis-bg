# What the package is for and how to use it, for tools and AI agents (see AGENTS.md).
# `import` paths and `check` ids are verified by tests/test_manifest.py.

[package]
name = "bazis-bg"
summary = "background tasks in PostgreSQL with a scheduler, periodic tasks and xlsx exports and imports"
solves = [
    "run long work outside the request (delay) with progress, logs, result and interruption",
    "periodic tasks by interval or cron expression",
    "limit the parallel tasks of a kind and make tasks wait for others",
    "export querysets to xlsx and import xlsx files in the background",
]
requires = ["bazis", "bazis-users", "bazis-author"]
pairs_well = []

[[extension_points]]
name = "BgBase"
import = "bazis.contrib.bg.basic.base.BgBase"
use_when = "a background task: handle(), queued with delay()"

[[extension_points]]
name = "BgBaseDownloadModel"
import = "bazis.contrib.bg.basic.base_download_model.BgBaseDownloadModel"
use_when = "export the objects of a model to xlsx (model, fields_read)"

[[extension_points]]
name = "BgBaseDownload"
import = "bazis.contrib.bg.basic.base_download.BgBaseDownload"
use_when = "export any rows to xlsx (get_queryset, get_count, get_titles)"

[[extension_points]]
name = "BgBaseLoad"
import = "bazis.contrib.bg.basic.base_load.BgBaseLoad"
use_when = "import the rows of an xlsx or zip file given as delay(fp=...) (load(reader))"

[[extension_points]]
name = "LoadDownloadAdminMixin"
import = "bazis.contrib.bg.admin_abstract.LoadDownloadAdminMixin"
use_when = "admin actions that start export, import or other tasks"

[[extension_points]]
name = "task_accepted"
import = "bazis.contrib.bg.routes.task_accepted"
use_when = "an action that queued a task answers 202 with its id and the URL the client polls"

[[extension_points]]
name = "Schedule"
import = "bazis.contrib.bg.declare.Schedule"
use_when = "a periodic task (seconds or a cron expression in UTC) in the SCHEDULES of <app>/schedules.py, applied by migrate"

[[extension_points]]
name = "TaskCron"
import = "bazis.contrib.bg.models.TaskCron"
use_when = "the periodic tasks in the database: declared ones (managed) and those of the admin"

[[pitfalls]]
text = "tasks run only while `manage.py bg_scheduler` runs (from the directory of manage.py)"

[[pitfalls]]
text = "BgRoute.restrict_queryset is also what the other routes link and include: a custom task route changes the rule there"

[[pitfalls]]
text = "a task runs without the request, its user or its language: pass the user id and the language as arguments, author=user"

[[pitfalls]]
text = "the file of a task is downloaded from GET /api/v1/bg/task/{id}/download/: its file attribute is a public media URL"

[[pitfalls]]
text = "the task route, and `included` of any route, gives authors `Error` for an error and no log (fields `error` and `log` of BgRoute); a custom task route subclasses BgRoute to keep them"

[[pitfalls]]
text = "do not declare permit_public = True on the task routes: they restrict the tasks themselves"

[[pitfalls]]
text = "with is_transaction, next_phase, progress syncs and set_result commit the work done so far"

[[pitfalls]]
text = "the scheduler deletes waiting tasks whose class path no longer imports"

[[pitfalls]]
text = "a task class without `name` cannot be queued and is not listed in the admin"

[[pitfalls]]
text = "declare a periodic task in <app>/schedules.py, not with get_or_create in a data migration"
check = "bg.W001"

[[pitfalls]]
text = "a periodic task of an old data migration or of the admin has no slug: declared in schedules.py it runs twice; delete the old row"
check = "bg.W002"

[[pitfalls]]
text = "a declared schedule names a named BgBase class and JSON kwargs that fit its __init__"
check = "bg.E002"
